# On every push to main: lint + type-check, then the VPS pulls the new commit itself
# (git clone at /home/deploy/TourComeMorocco, using its own deploy key) and rebuilds.
# The site is reached through the shared edge-nginx stack on the server (see ../.edge-stack);
# this workflow only manages the app container itself.
# Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST         server IP
#   SSH_USER         SSH user
#   SSH_PRIVATE_KEY  private key whose public key is in ~/.ssh/authorized_keys on the server
#   SSH_KNOWN_HOSTS  output of: ssh-keyscan <server IP>
# Variable DEPLOY_ENABLED=true turns on the deploy job.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: /home/deploy/TourComeMorocco

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint

  deploy:
    needs: check
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull + build + restart on the VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            eval \$(ssh-agent -s) >/dev/null
            ssh-add ~/.ssh/github_vps
            cd ${{ env.APP_DIR }}
            git fetch origin main
            git reset --hard origin/main
            docker network create edge 2>/dev/null || true
            docker compose build web
            docker compose up -d --remove-orphans
            docker image prune -f
          "

      - name: Smoke test
        run: |
          sleep 10
          curl -fsS -o /dev/null -w "%{http_code}\n" https://tourmemorocco.com/
