# tourmemorocco.com — app container only; reached through the shared edge-nginx
# stack on the VPS (see ../.edge-stack). Deployed by .github/workflows/deploy.yml.
networks:
  edge:
    external: true

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://tourmemorocco.com
    image: tourmemorocco-web
    container_name: tourmemorocco-web
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
