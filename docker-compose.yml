services:
  web:
    build: .
    image: serenity-nextjs-web
    container_name: serenity-nextjs-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/favicon.ico"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - edge

networks:
  edge:
    external: true
