# marrakech-abdelah.com — canonical host is https://marrakech-abdelah.com (no www).

upstream nextjs {
    server web:3000;
    keepalive 32;
}

# HTTP: Let's Encrypt challenges, everything else → HTTPS apex.
server {
    listen 80;
    listen [::]:80;
    server_name marrakech-abdelah.com www.marrakech-abdelah.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://marrakech-abdelah.com$request_uri;
    }
}

# HTTPS www → apex (one canonical host for SEO).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.marrakech-abdelah.com;

    ssl_certificate     /etc/letsencrypt/live/marrakech-abdelah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marrakech-abdelah.com/privkey.pem;

    return 301 https://marrakech-abdelah.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marrakech-abdelah.com;

    ssl_certificate     /etc/letsencrypt/live/marrakech-abdelah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marrakech-abdelah.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml application/manifest+json;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Hashed build assets never change.
    location /_next/static/ {
        proxy_pass http://nextjs;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://nextjs;
    }
}
